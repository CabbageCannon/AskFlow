<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1880" viewBox="0 0 2600 1880">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#059669"/></marker>
    <style>
      .title { font-family: SimHei; font-size: 36px; font-weight: 700; fill: #0f172a; }
      .section { font-family: SimHei; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .node { font-family: SimHei; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .body { font-family: SimHei; font-size: 16px; fill: #334155; }
      .small { font-family: SimHei; font-size: 14px; fill: #475569; }
      .label { font-family: SimHei; font-size: 15px; font-weight: 700; fill: #334155; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .model { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.3; }
      .tool { fill: #ecfdf5; stroke: #059669; stroke-width: 2.3; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.3; }
      .decision { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.3; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.3; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#blueArrow); }
      .green { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#greenArrow); }
      .dash { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 10 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2600" height="1880" fill="#ffffff"/>
  <text x="55" y="60" class="title">Open Deep Research：后端运行流程（自适应证据补研版）</text>
  <text x="55" y="91" class="body">入口：langgraph.json → src/open_deep_research/deep_researcher.py:deep_researcher</text>

  <!-- Request and state -->
  <rect x="45" y="120" width="2510" height="174" rx="10" class="group"/>
  <text x="70" y="154" class="section">请求、配置与总状态</text>
  <rect x="75" y="180" width="315" height="76" rx="8" class="box"/>
  <text x="100" y="210" class="node">LangGraph API / Studio</text>
  <text x="100" y="237" class="body">提交 messages + configurable</text>
  <rect x="460" y="180" width="355" height="76" rx="8" class="warn"/>
  <text x="485" y="210" class="node">认证（部署时可选）</text>
  <text x="485" y="237" class="body">Supabase JWT → 线程 / 存储 owner</text>
  <rect x="885" y="166" width="690" height="104" rx="8" class="box"/>
  <text x="910" y="198" class="node">Configuration</text>
  <text x="910" y="224" class="body">环境变量优先；其次为本次 run 的 configurable</text>
  <text x="910" y="250" class="small">模型、搜索 API、并发、工具预算、验证轮数、MCP、重试</text>
  <rect x="1645" y="166" width="830" height="104" rx="8" class="state"/>
  <text x="1670" y="198" class="node">AgentState</text>
  <text x="1670" y="224" class="body">messages / research_brief / notes / raw_notes / verification_result</text>
  <text x="1670" y="250" class="small">verification_iterations / targeted_research_tasks / final_report</text>
  <path d="M390 218 H460" class="line"/><path d="M815 218 H885" class="line"/><path d="M1575 218 H1645" class="line"/>

  <!-- Main initial chain -->
  <rect x="45" y="325" width="2510" height="305" rx="10" class="group"/>
  <text x="70" y="360" class="section">第一阶段：澄清问题与初次广泛研究</text>
  <rect x="75" y="420" width="95" height="64" rx="32" class="box"/><text x="100" y="460" class="node">START</text>
  <rect x="235" y="398" width="365" height="108" rx="8" class="model"/>
  <text x="260" y="432" class="node">clarify_with_user</text>
  <text x="260" y="458" class="body">结构化输出 ClarifyWithUser</text>
  <text x="260" y="483" class="small">allow_clarification；结构化输出最多重试 N 次</text>
  <path d="M170 452 H235" class="blue"/>
  <polygon points="745,390 875,452 745,514 615,452" class="decision"/>
  <text x="682" y="446" class="node">需要用户澄清？</text><text x="699" y="470" class="small">且已启用追问</text>
  <path d="M600 452 H615" class="blue"/>
  <text x="884" y="428" class="label">否</text>
  <rect x="940" y="398" width="395" height="108" rx="8" class="model"/>
  <text x="965" y="432" class="node">write_research_brief</text>
  <text x="965" y="458" class="body">生成 research_brief，初始化 supervisor_messages</text>
  <text x="965" y="483" class="small">system prompt + 标准化后的研究问题</text>
  <path d="M875 452 H940" class="blue"/>
  <rect x="1410" y="398" width="460" height="108" rx="8" class="state"/>
  <text x="1435" y="432" class="node">research_supervisor 子图</text>
  <text x="1435" y="458" class="body">拆解问题、并发委派 researcher、回收研究摘要</text>
  <text x="1435" y="483" class="small">完成后产出 notes + raw_notes</text>
  <path d="M1335 452 H1410" class="line"/>
  <rect x="1960" y="398" width="515" height="108" rx="8" class="model"/>
  <text x="1985" y="432" class="node">evidence_verifier</text>
  <text x="1985" y="458" class="body">审计覆盖度、可信度、冲突与证据缺口</text>
  <text x="1985" y="483" class="small">结构化输出 VerificationResult</text>
  <path d="M1870 452 H1960" class="blue"/>
  <rect x="210" y="545" width="410" height="50" rx="25" class="decision"/>
  <text x="248" y="577" class="node">END：返回澄清问题，等待下一次 run</text>
  <path d="M745 514 V570 H620" class="line"/><text x="765" y="540" class="label">是</text>

  <!-- Supervisor and researcher -->
  <rect x="45" y="660" width="2510" height="435" rx="10" class="group"/>
  <text x="70" y="695" class="section">research_supervisor 子图：初次研究的调度闭环</text>
  <text x="70" y="721" class="small">SupervisorState：supervisor_messages / research_brief / research_iterations / notes / raw_notes</text>
  <rect x="80" y="760" width="315" height="104" rx="8" class="model"/>
  <text x="105" y="794" class="node">supervisor</text>
  <text x="105" y="820" class="body">Research Model + bind_tools</text>
  <text x="105" y="844" class="small">ConductResearch / think_tool / ResearchComplete</text>
  <rect x="470" y="760" width="320" height="104" rx="8" class="tool"/>
  <text x="495" y="794" class="node">supervisor_tools</text>
  <text x="495" y="820" class="body">解析 tool_calls，写回 ToolMessage</text>
  <text x="495" y="844" class="small">每轮 supervisor 后 research_iterations +1</text>
  <path d="M395 812 H470" class="green"/>
  <polygon points="940,750 1085,812 940,874 795,812" class="decision"/>
  <text x="865" y="806" class="node">工具 / 退出条件？</text><text x="877" y="830" class="small">按 tool_calls 分流</text>
  <path d="M790 812 H795" class="green"/>
  <rect x="1175" y="748" width="430" height="75" rx="8" class="tool"/>
  <text x="1200" y="780" class="node">think_tool</text><text x="1200" y="805" class="body">反思结果写入 ToolMessage，回到 supervisor</text>
  <path d="M1085 785 H1175" class="green"/>
  <path d="M1390 823 V892 H237 V864" class="green"/>
  <text x="720" y="887" class="label">继续规划与委派</text>
  <rect x="1175" y="850" width="475" height="100" rx="8" class="tool"/>
  <text x="1200" y="883" class="node">ConductResearch × N</text>
  <text x="1200" y="909" class="body">最多 max_concurrent_research_units 个 researcher 并发</text>
  <text x="1200" y="934" class="small">超出任务返回错误 ToolMessage；允许任务 asyncio.gather</text>
  <path d="M1085 842 H1175" class="green"/>
  <rect x="1780" y="760" width="700" height="104" rx="8" class="decision"/>
  <text x="1805" y="794" class="node">结束初次研究</text>
  <text x="1805" y="820" class="body">ResearchComplete / 无 tool_calls / 超过 max_researcher_iterations</text>
  <text x="1805" y="844" class="small">或 researcher 执行异常；提取 supervisor 的 ToolMessage 为 notes</text>
  <path d="M1085 812 H1780" class="line"/>
  <path d="M2130 864 V1125" class="line"/>

  <rect x="80" y="980" width="1570" height="90" rx="8" class="group"/>
  <text x="105" y="1012" class="node">researcher 子图（每个初次研究任务、每个定向补研任务都会复用）</text>
  <rect x="105" y="1025" width="235" height="34" rx="6" class="model"/><text x="121" y="1049" class="label">researcher：模型生成工具调用</text>
  <rect x="410" y="1025" width="315" height="34" rx="6" class="tool"/><text x="426" y="1049" class="label">researcher_tools：预算筛选 + 并发执行</text>
  <rect x="795" y="1025" width="330" height="34" rx="6" class="tool"/><text x="811" y="1049" class="label">Search API / MCP / think_tool / Complete</text>
  <rect x="1195" y="1025" width="420" height="34" rx="6" class="state"/><text x="1211" y="1049" class="label">compress_research：compressed_research + raw_notes</text>
  <path d="M340 1042 H410" class="green"/><path d="M725 1042 H795" class="green"/><path d="M1125 1042 H1195" class="line"/>
  <text x="105" y="1087" class="small">预算：单轮 max_tool_calls_per_iteration；单 researcher 总计 max_total_tool_calls；实际并发由 max_concurrent_tool_calls 的 Semaphore 限制。</text>

  <!-- Evidence loop -->
  <rect x="45" y="1125" width="2510" height="430" rx="10" class="group"/>
  <text x="70" y="1160" class="section">第二阶段：证据验证与定向补研（新增自适应闭环）</text>
  <text x="70" y="1187" class="small">初次研究完成后的 notes + raw_notes 进入这里；补研不再回到 supervisor，而是直接复用 researcher 子图。</text>
  <rect x="75" y="1235" width="385" height="112" rx="8" class="state"/>
  <text x="100" y="1268" class="node">VerificationResult</text>
  <text x="100" y="1294" class="body">coverage_score / credibility_score / conflicts</text>
  <text x="100" y="1320" class="body">missing_evidence / evidence_sufficient / evidence_gaps</text>
  <path d="M2130 1125 V1291 H460" class="line"/>
  <rect x="545" y="1235" width="370" height="112" rx="8" class="model"/>
  <text x="570" y="1268" class="node">route_after_verification</text>
  <text x="570" y="1294" class="body">决定直接写报告，还是进入定向补研</text>
  <text x="570" y="1320" class="small">验证轮数、资料充足度、可行动缺口共同决策</text>
  <path d="M460 1291 H545" class="blue"/>
  <polygon points="1060,1218 1205,1291 1060,1364 915,1291" class="decision"/>
  <text x="985" y="1285" class="node">是否值得补研？</text><text x="973" y="1310" class="small">必须同时满足下列条件</text>
  <path d="M915 1291 H915" class="blue"/>
  <rect x="1285" y="1210" width="560" height="160" rx="8" class="tool"/>
  <text x="1310" y="1244" class="node">plan_targeted_research</text>
  <text x="1310" y="1270" class="body">筛选 expected_information_gain ≥ min_expected_information_gain 的 gaps</text>
  <text x="1310" y="1296" class="body">按 importance × information_gain 排序，生成 TargetedResearchTask</text>
  <text x="1310" y="1322" class="small">任务数 ≤ min(max_concurrent_research_units, max_targeted_research_tasks_per_round)</text>
  <path d="M1205 1291 H1285" class="green"/><text x="1220" y="1270" class="label">是</text>
  <rect x="1925" y="1210" width="555" height="160" rx="8" class="tool"/>
  <text x="1950" y="1244" class="node">targeted_research</text>
  <text x="1950" y="1270" class="body">并发调用 researcher 子图，只研究每个具体 evidence gap</text>
  <text x="1950" y="1296" class="body">收集 compressed_research / raw_notes，与旧资料做规范化去重</text>
  <text x="1950" y="1322" class="small">成功有新资料：追加 notes / raw_notes；否则直接写报告</text>
  <path d="M1845 1291 H1925" class="green"/>
  <path d="M2202 1370 V1412 H1295" class="line"/>
  <text x="1640" y="1400" class="label">无新证据 / 无任务</text>
  <path d="M2202 1370 V1515 H350 V1347" class="dash"/>
  <text x="1080" y="1540" class="label">有新证据：回到 evidence_verifier，重新审查</text>
  <rect x="695" y="1408" width="600" height="82" rx="8" class="decision"/>
  <text x="720" y="1441" class="node">直接写报告的条件（任一成立）</text>
  <text x="720" y="1467" class="body">达到 max_verification_iteration / evidence_sufficient / 无可行动 gaps / 无新资料 / 防御性缺省</text>
  <path d="M1060 1364 V1408" class="line"/><text x="1080" y="1392" class="label">否</text>

  <!-- Report -->
  <rect x="45" y="1590" width="2510" height="190" rx="10" class="group"/>
  <text x="70" y="1625" class="section">第三阶段：最终报告</text>
  <rect x="75" y="1660" width="740" height="78" rx="8" class="model"/>
  <text x="100" y="1692" class="node">final_report_generation</text>
  <text x="100" y="1718" class="body">输入 research_brief + messages + notes + verification_result，使用 final_report_model</text>
  <rect x="910" y="1660" width="730" height="78" rx="8" class="warn"/>
  <text x="935" y="1692" class="node">异常与重试</text>
  <text x="935" y="1718" class="body">上下文超限时裁剪 findings，最多重试 3 次；其他错误直接返回错误消息</text>
  <rect x="1735" y="1660" width="745" height="78" rx="8" class="state"/>
  <text x="1760" y="1692" class="node">END：返回最终报告</text>
  <text x="1760" y="1718" class="body">final_report + AIMessage 写入 AgentState；notes 在成功或错误路径中清空</text>
  <path d="M1295 1490 V1699 H815" class="blue"/><path d="M815 1699 H910" class="blue"/><path d="M1640 1699 H1735" class="blue"/>

  <!-- Legend -->
  <rect x="45" y="1810" width="2510" height="45" rx="8" class="group"/>
  <rect x="75" y="1823" width="20" height="20" class="model"/><text x="106" y="1840" class="small">蓝：模型 / 结构化输出</text>
  <rect x="350" y="1823" width="20" height="20" class="tool"/><text x="381" y="1840" class="small">绿：工具、任务规划与外部检索</text>
  <rect x="710" y="1823" width="20" height="20" class="state"/><text x="741" y="1840" class="small">紫：状态 / 子图结果</text>
  <rect x="1015" y="1823" width="20" height="20" class="decision"/><text x="1046" y="1840" class="small">红：路由与结束条件</text>
  <text x="1400" y="1840" class="small">虚线：自适应补研后的证据回流；代码定位：deep_researcher.py / state.py / configuration.py / prompts.py。</text>
</svg>
