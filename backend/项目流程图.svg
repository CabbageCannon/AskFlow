<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2050" viewBox="0 0 2600 2050">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#059669"/></marker>
    <style>
      .title{font-family:SimHei;font-size:36px;font-weight:700;fill:#0f172a}.section{font-family:SimHei;font-size:25px;font-weight:700;fill:#0f172a}.node{font-family:SimHei;font-size:20px;font-weight:700;fill:#0f172a}.body{font-family:SimHei;font-size:16px;fill:#334155}.small{font-family:SimHei;font-size:14px;fill:#475569}.label{font-family:SimHei;font-size:15px;font-weight:700;fill:#334155}
      .group{fill:#f8fafc;stroke:#64748b;stroke-width:2.5}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.model{fill:#eff6ff;stroke:#2563eb;stroke-width:2.3}.tool{fill:#ecfdf5;stroke:#059669;stroke-width:2.3}.state{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.3}.decision{fill:#fef2f2;stroke:#dc2626;stroke-width:2.3}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.3}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.blue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#b)}.green{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#g)}.dash{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="2600" height="2050" fill="#fff"/>
  <text x="50" y="60" class="title">Open Deep Research：后端运行流程（模型路由与工具恢复版）</text>
  <text x="50" y="91" class="body">入口：langgraph.json → src/open_deep_research/deep_researcher.py:deep_researcher</text>

  <!-- Cross-cutting runtime -->
  <rect x="40" y="120" width="2520" height="205" rx="10" class="group"/>
  <text x="65" y="155" class="section">运行时支撑层：配置、任务级模型路由与统一模型调用</text>
  <rect x="70" y="185" width="260" height="88" rx="8" class="box"/><text x="94" y="220" class="node">API / Studio</text><text x="94" y="247" class="body">messages + configurable</text>
  <rect x="405" y="175" width="430" height="108" rx="8" class="state"/><text x="430" y="208" class="node">Configuration</text><text x="430" y="234" class="body">环境变量优先；Bailian API / base URL</text><text x="430" y="260" class="small">动态路由、低成本偏好、预算、重试、fallback</text>
  <rect x="910" y="165" width="570" height="128" rx="8" class="model"/><text x="935" y="198" class="node">route_model_for_text</text><text x="935" y="224" class="body">TaskType + 文本规模 / 复杂度 → 兼容模型候选</text><text x="935" y="250" class="body">硬约束过滤（工具 / 结构化输出 / 上下文）+ 成本与任务亲和度评分</text><text x="935" y="276" class="small">可按配置关闭动态选择，回退到任务默认 Profile</text>
  <rect x="1555" y="175" width="445" height="108" rx="8" class="model"/><text x="1580" y="208" class="node">ModelDecision → Runtime Config</text><text x="1580" y="234" class="body">模型、max_tokens、API key、base URL、extra_body</text><text x="1580" y="260" class="small">build_routed_model_runtime_config</text>
  <rect x="2075" y="175" width="450" height="108" rx="8" class="box"/><text x="2100" y="208" class="node">configurable_model</text><text x="2100" y="234" class="body">统一执行模型调用</text><text x="2100" y="260" class="small">各节点按 TaskType 使用不同模型</text>
  <path d="M330 229 H405" class="line"/><path d="M835 229 H910" class="blue"/><path d="M1480 229 H1555" class="blue"/><path d="M2000 229 H2075" class="blue"/>
  <text x="70" y="310" class="small">TaskType：Clarification / Research Brief / Supervisor / Researcher / Webpage Summarization / Compression / Evidence Verification / Final Report。</text>

  <!-- Main graph -->
  <rect x="40" y="355" width="2520" height="265" rx="10" class="group"/>
  <text x="65" y="390" class="section">主图：输入澄清 → 初次研究 → 证据验证</text>
  <rect x="70" y="454" width="92" height="62" rx="31" class="box"/><text x="94" y="493" class="node">START</text>
  <rect x="230" y="432" width="360" height="106" rx="8" class="model"/><text x="255" y="465" class="node">clarify_with_user</text><text x="255" y="491" class="body">TaskType.CLARIFICATION；结构化 ClarifyWithUser</text><text x="255" y="516" class="small">追问开启且范围不清时结束本次 run</text>
  <path d="M162 485 H230" class="blue"/>
  <polygon points="740,424 870,485 740,546 610,485" class="decision"/><text x="678" y="480" class="node">需要澄清？</text><text x="689" y="505" class="small">allow_clarification</text><path d="M590 485 H610" class="blue"/>
  <rect x="940" y="432" width="380" height="106" rx="8" class="model"/><text x="965" y="465" class="node">write_research_brief</text><text x="965" y="491" class="body">TaskType.RESEARCH_BRIEF；生成 research_brief</text><text x="965" y="516" class="small">初始化 supervisor_messages（system + brief）</text><path d="M870 485 H940" class="blue"/><text x="882" y="463" class="label">否</text>
  <rect x="1395" y="432" width="445" height="106" rx="8" class="state"/><text x="1420" y="465" class="node">research_supervisor 子图</text><text x="1420" y="491" class="body">初次广泛研究：规划、并发委派、回收摘要</text><text x="1420" y="516" class="small">输出 notes + raw_notes</text><path d="M1320 485 H1395" class="line"/>
  <rect x="1915" y="432" width="565" height="106" rx="8" class="model"/><text x="1940" y="465" class="node">evidence_verifier</text><text x="1940" y="491" class="body">TaskType.EVIDENCE_VERIFICATION；输出 VerificationResult</text><text x="1940" y="516" class="small">覆盖度、可信度、冲突、缺口与 evidence_sufficient</text><path d="M1840 485 H1915" class="blue"/>
  <rect x="200" y="556" width="400" height="45" rx="22" class="decision"/><text x="237" y="586" class="node">END：返回澄清问题，等待下一次 run</text><path d="M740 546 V579 H600" class="line"/><text x="758" y="567" class="label">是</text>

  <!-- Research subgraphs -->
  <rect x="40" y="650" width="2520" height="610" rx="10" class="group"/>
  <text x="65" y="685" class="section">初次研究调度与 Researcher 子图</text>
  <text x="65" y="711" class="small">SupervisorState：supervisor_messages / research_brief / research_iterations / notes / raw_notes</text>
  <rect x="75" y="750" width="305" height="105" rx="8" class="model"/><text x="100" y="783" class="node">supervisor</text><text x="100" y="809" class="body">TaskType.SUPERVISOR + bind_tools</text><text x="100" y="833" class="small">ConductResearch / think_tool / ResearchComplete</text>
  <rect x="455" y="750" width="320" height="105" rx="8" class="tool"/><text x="480" y="783" class="node">supervisor_tools</text><text x="480" y="809" class="body">解析 tool_calls，回写 ToolMessage</text><text x="480" y="833" class="small">research_iterations 每轮 +1</text><path d="M380 802 H455" class="green"/>
  <polygon points="920,741 1060,802 920,863 780,802" class="decision"/><text x="847" y="797" class="node">工具 / 退出？</text><text x="854" y="821" class="small">按 tool_calls 分流</text><path d="M775 802 H780" class="green"/>
  <rect x="1145" y="735" width="410" height="72" rx="8" class="tool"/><text x="1170" y="765" class="node">think_tool</text><text x="1170" y="790" class="body">反思结果回写，循环 supervisor</text><path d="M1060 772 H1145" class="green"/><path d="M1350 807 V880 H225 V855" class="green"/>
  <rect x="1145" y="838" width="510" height="94" rx="8" class="tool"/><text x="1170" y="870" class="node">ConductResearch × N</text><text x="1170" y="896" class="body">最多 max_concurrent_research_units 个 researcher 并发</text><text x="1170" y="918" class="small">asyncio.gather；超出任务写错误 ToolMessage</text><path d="M1060 835 H1145" class="green"/>
  <rect x="1780" y="750" width="695" height="105" rx="8" class="decision"/><text x="1805" y="783" class="node">结束初次研究</text><text x="1805" y="809" class="body">ResearchComplete / 无 tool_calls / 超过 max_researcher_iterations</text><text x="1805" y="833" class="small">从 supervisor ToolMessage 提取 notes，进入 evidence_verifier</text><path d="M1060 802 H1780" class="line"/>

  <rect x="75" y="965" width="2400" height="258" rx="8" class="group"/>
  <text x="100" y="997" class="node">researcher 子图：初次任务与定向补研任务共用</text>
  <rect x="105" y="1030" width="310" height="86" rx="8" class="model"/><text x="130" y="1061" class="node">researcher</text><text x="130" y="1087" class="body">TaskType.RESEARCHER + get_all_tools</text>
  <rect x="495" y="1030" width="430" height="86" rx="8" class="tool"/><text x="520" y="1061" class="node">researcher_tools：预算准入</text><text x="520" y="1087" class="body">控制工具不限额；检索 / MCP 受单轮与总预算约束</text><path d="M415 1073 H495" class="green"/>
  <rect x="1005" y="1030" width="415" height="86" rx="8" class="tool"/><text x="1030" y="1061" class="node">并发工具执行</text><text x="1030" y="1087" class="body">Semaphore(max_concurrent_tool_calls)</text><path d="M925 1073 H1005" class="green"/>
  <rect x="1500" y="1016" width="520" height="114" rx="8" class="warn"/><text x="1525" y="1048" class="node">工具恢复与搜索降级</text><text x="1525" y="1074" class="body">分类错误；仅“瞬态 + 幂等”允许指数退避 + 随机抖动重试</text><text x="1525" y="1100" class="small">搜索工具重试耗尽后，可按策略切到一个备用搜索源</text><path d="M1420 1073 H1500" class="line"/>
  <rect x="2100" y="1030" width="340" height="86" rx="8" class="state"/><text x="2125" y="1061" class="node">ToolMessage</text><text x="2125" y="1087" class="body">成功结果、跳过原因或错误信息</text><path d="M2020 1073 H2100" class="line"/>
  <path d="M2270 1116 V1160 H260 V1116" class="green"/><text x="970" y="1156" class="label">继续研究：工具结果回填 researcher_messages</text>
  <rect x="585" y="1168" width="650" height="38" rx="6" class="state"/><text x="604" y="1193" class="label">compress_research：TaskType.COMPRESSION → compressed_research + raw_notes</text>
  <text x="100" y="1218" class="small">退出：无工具调用且无原生搜索 / ResearchComplete / 总工具预算耗尽（当前实现还保留 react_iterations 与 max_react_iterations 的旧条件）。</text>

  <!-- adaptive evidence loop -->
  <rect x="40" y="1290" width="2520" height="455" rx="10" class="group"/>
  <text x="65" y="1325" class="section">自适应证据补研闭环</text><text x="65" y="1351" class="small">初次研究与每轮补研的 notes / raw_notes 都进入验证；补研直接复用 researcher 子图，不重新经过 Supervisor。</text>
  <rect x="75" y="1400" width="385" height="110" rx="8" class="state"/><text x="100" y="1433" class="node">VerificationResult</text><text x="100" y="1459" class="body">coverage / credibility / conflicts / missing evidence</text><text x="100" y="1485" class="body">evidence_sufficient + evidence_gaps</text>
  <path d="M2125 855 V1455 H460" class="line"/>
  <rect x="545" y="1400" width="385" height="110" rx="8" class="model"/><text x="570" y="1433" class="node">route_after_verification</text><text x="570" y="1459" class="body">验证轮数、资料充分性、可行动缺口共同路由</text><text x="570" y="1485" class="small">TaskType.EVIDENCE_VERIFICATION 已在前节点完成</text><path d="M460 1455 H545" class="blue"/>
  <polygon points="1085,1385 1230,1455 1085,1525 940,1455" class="decision"/><text x="1012" y="1450" class="node">值得定向补研？</text><text x="999" y="1475" class="small">收益阈值 + 轮数上限</text><path d="M930 1455 H940" class="blue"/>
  <rect x="1320" y="1375" width="525" height="160" rx="8" class="tool"/><text x="1345" y="1408" class="node">plan_targeted_research</text><text x="1345" y="1434" class="body">筛选 expected_information_gain ≥ min_expected_information_gain</text><text x="1345" y="1460" class="body">按 importance × information_gain 排序，生成 TargetedResearchTask</text><text x="1345" y="1486" class="small">任务数受并发与 max_targeted_research_tasks_per_round 双重限制</text><path d="M1230 1455 H1320" class="green"/><text x="1245" y="1433" class="label">是</text>
  <rect x="1935" y="1375" width="540" height="160" rx="8" class="tool"/><text x="1960" y="1408" class="node">targeted_research</text><text x="1960" y="1434" class="body">并发运行 researcher 子图，只聚焦每个 evidence gap</text><text x="1960" y="1460" class="body">收集结果，与已有 notes / raw_notes 规范化去重</text><text x="1960" y="1486" class="small">有新证据回审；无新证据或无任务直接写报告</text><path d="M1845 1455 H1935" class="green"/>
  <rect x="675" y="1575" width="650" height="80" rx="8" class="decision"/><text x="700" y="1607" class="node">直接写报告（任一条件）</text><text x="700" y="1633" class="body">验证次数达到 max_verification_iterations / 资料充分 / 无可行动缺口 / 无新证据 / 防御性缺省</text><path d="M1085 1525 V1575" class="line"/><text x="1103" y="1552" class="label">否</text>
  <path d="M2205 1535 V1605 H1325" class="line"/><text x="1710" y="1590" class="label">无新证据 / 无任务</text>
  <path d="M2205 1535 V1695 H270 V1510" class="dash"/><text x="1000" y="1724" class="label">有新证据：追加 notes / raw_notes，回到 evidence_verifier</text>

  <!-- report -->
  <rect x="40" y="1780" width="2520" height="190" rx="10" class="group"/>
  <text x="65" y="1815" class="section">最终报告</text>
  <rect x="75" y="1850" width="760" height="80" rx="8" class="model"/><text x="100" y="1883" class="node">final_report_generation</text><text x="100" y="1910" class="body">TaskType.FINAL_REPORT；输入 brief + messages + findings + VerificationResult</text>
  <rect x="930" y="1850" width="705" height="80" rx="8" class="warn"/><text x="955" y="1883" class="node">上下文与错误处理</text><text x="955" y="1910" class="body">上下文超限时裁剪 findings，最多重试 3 次；其他异常直接返回错误信息</text>
  <rect x="1730" y="1850" width="745" height="80" rx="8" class="state"/><text x="1755" y="1883" class="node">END：最终报告</text><text x="1755" y="1910" class="body">final_report + AIMessage 写入 AgentState；清空 notes</text>
  <path d="M1325 1655 V1890 H835" class="blue"/><path d="M835 1890 H930" class="blue"/><path d="M1635 1890 H1730" class="blue"/>

  <rect x="40" y="1990" width="2520" height="40" rx="8" class="group"/><rect x="70" y="2000" width="20" height="20" class="model"/><text x="101" y="2017" class="small">蓝：模型 / 路由</text><rect x="320" y="2000" width="20" height="20" class="tool"/><text x="351" y="2017" class="small">绿：工具 / 任务执行</text><rect x="610" y="2000" width="20" height="20" class="state"/><text x="641" y="2017" class="small">紫：状态 / 子图结果</text><rect x="930" y="2000" width="20" height="20" class="decision"/><text x="961" y="2017" class="small">红：分支与终止条件</text><rect x="1250" y="2000" width="20" height="20" class="warn"/><text x="1281" y="2017" class="small">橙：恢复与异常处理</text><text x="1640" y="2017" class="small">虚线：补研后的证据回流。代码定位：deep_researcher.py / model_router.py / tool_recovery.py / search_fallback.py。</text>
</svg>
