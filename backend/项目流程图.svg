<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1720" viewBox="0 0 2400 1720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <style>
      .title { font-family: SimHei; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .section { font-family: SimHei; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .nodeTitle { font-family: SimHei; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .body { font-family: SimHei; font-size: 16px; fill: #334155; }
      .small { font-family: SimHei; font-size: 14px; fill: #475569; }
      .label { font-family: SimHei; font-size: 14px; font-weight: 700; fill: #334155; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .model { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .tool { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .result { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .warning { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .decision { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .greenLine { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="2400" height="1720" fill="#ffffff"/>
  <text x="60" y="62" class="title">Open Deep Research 后端运行流程</text>
  <text x="60" y="92" class="body">入口：langgraph.json → src/open_deep_research/deep_researcher.py:deep_researcher</text>

  <!-- Runtime boundary -->
  <rect x="50" y="120" width="2300" height="170" rx="10" class="group"/>
  <text x="76" y="153" class="section">请求与运行配置</text>
  <rect x="80" y="176" width="315" height="78" rx="8" class="box"/>
  <text x="105" y="207" class="nodeTitle">LangGraph API / Studio</text>
  <text x="105" y="233" class="body">提交 messages 与 configurable</text>
  <rect x="465" y="176" width="290" height="78" rx="8" class="warning"/>
  <text x="490" y="207" class="nodeTitle">可选认证中间件</text>
  <text x="490" y="233" class="body">Supabase JWT → 用户 owner</text>
  <rect x="825" y="160" width="690" height="110" rx="8" class="box"/>
  <text x="850" y="192" class="nodeTitle">Configuration.from_runnable_config</text>
  <text x="850" y="218" class="body">环境变量优先，其次是本次 run 的 configurable</text>
  <text x="850" y="244" class="small">模型、搜索 API、并发数、迭代上限、MCP、重试策略</text>
  <rect x="1585" y="176" width="660" height="78" rx="8" class="result"/>
  <text x="1610" y="207" class="nodeTitle">AgentInputState</text>
  <text x="1610" y="233" class="body">输入状态只有 messages；其余状态在图执行中补齐</text>
  <path d="M395 215 H465" class="line"/><path d="M755 215 H825" class="line"/><path d="M1515 215 H1585" class="line"/>

  <!-- Main graph -->
  <rect x="50" y="320" width="2300" height="245" rx="10" class="group"/>
  <text x="76" y="354" class="section">主图：AgentState</text>
  <rect x="90" y="390" width="90" height="70" rx="35" class="box"/>
  <text x="114" y="433" class="nodeTitle">START</text>
  <rect x="250" y="375" width="355" height="100" rx="8" class="model"/>
  <text x="275" y="408" class="nodeTitle">clarify_with_user</text>
  <text x="275" y="434" class="body">结构化输出 ClarifyWithUser</text>
  <text x="275" y="458" class="small">最多 max_structured_output_retries 次</text>
  <path d="M180 425 H250" class="blueLine"/>
  <polygon points="725,370 850,425 725,480 600,425" class="decision"/>
  <text x="665" y="419" class="nodeTitle">需要澄清？</text><text x="691" y="443" class="small">allow_clarification</text>
  <path d="M605 425 H600" class="blueLine"/>
  <rect x="910" y="375" width="390" height="100" rx="8" class="model"/>
  <text x="935" y="408" class="nodeTitle">write_research_brief</text>
  <text x="935" y="434" class="body">生成结构化 research_brief</text>
  <text x="935" y="458" class="small">初始化 supervisor_messages（system + brief）</text>
  <path d="M850 425 H910" class="blueLine"/>
  <rect x="1385" y="375" width="390" height="100" rx="8" class="result"/>
  <text x="1410" y="408" class="nodeTitle">research_supervisor 子图</text>
  <text x="1410" y="434" class="body">规划、委派、汇总并判断是否完成</text>
  <text x="1410" y="458" class="small">详情见下方 supervisor / researcher 闭环</text>
  <path d="M1300 425 H1385" class="line"/>
  <rect x="1860" y="375" width="390" height="100" rx="8" class="model"/>
  <text x="1885" y="408" class="nodeTitle">final_report_generation</text>
  <text x="1885" y="434" class="body">整合 findings，生成最终报告</text>
  <text x="1885" y="458" class="small">结果写入 messages 与 final_report</text>
  <path d="M1775 425 H1860" class="blueLine"/>
  <path d="M725 370 V340 H2110" class="dash"/>
  <rect x="2040" y="500" width="210" height="42" rx="21" class="decision"/>
  <text x="2078" y="528" class="nodeTitle">END：请求澄清</text>
  <path d="M725 480 V521 H2040" class="line"/>
  <text x="1330" y="545" class="small">用户下一次提交补充消息后，会重新启动一轮主图</text>

  <!-- Supervisor -->
  <rect x="50" y="595" width="2300" height="490" rx="10" class="group"/>
  <text x="76" y="630" class="section">research_supervisor 子图：SupervisorState</text>
  <text x="76" y="658" class="small">关键状态：supervisor_messages、research_brief、research_iterations、notes、raw_notes</text>
  <rect x="90" y="700" width="325" height="110" rx="8" class="model"/>
  <text x="115" y="735" class="nodeTitle">supervisor</text>
  <text x="115" y="761" class="body">Research Model + bind_tools</text>
  <text x="115" y="787" class="small">ConductResearch / ResearchComplete / think_tool</text>
  <rect x="490" y="700" width="350" height="110" rx="8" class="tool"/>
  <text x="515" y="735" class="nodeTitle">supervisor_tools</text>
  <text x="515" y="761" class="body">解析 tool_calls，写回 ToolMessage</text>
  <text x="515" y="787" class="small">research_iterations 每次 supervisor 调用后 +1</text>
  <path d="M415 755 H490" class="greenLine"/>
  <polygon points="990,690 1135,755 990,820 845,755" class="decision"/>
  <text x="915" y="748" class="nodeTitle">调用了哪类工具？</text>
  <text x="918" y="772" class="small">或达到退出条件</text>
  <path d="M840 755 H845" class="greenLine"/>
  <rect x="1235" y="680" width="385" height="85" rx="8" class="tool"/>
  <text x="1260" y="714" class="nodeTitle">think_tool</text>
  <text x="1260" y="740" class="body">反思内容写成 ToolMessage</text>
  <path d="M1135 720 H1235" class="greenLine"/>
  <path d="M1427 765 V850 H252 V810" class="greenLine"/>
  <text x="805" y="844" class="label">继续 supervisor 推理循环</text>
  <rect x="1235" y="790" width="480" height="115" rx="8" class="tool"/>
  <text x="1260" y="824" class="nodeTitle">ConductResearch × N</text>
  <text x="1260" y="850" class="body">最多启动 max_concurrent_research_units 个任务</text>
  <text x="1260" y="876" class="small">超出部分返回错误 ToolMessage；允许的任务 asyncio.gather 并发</text>
  <path d="M1135 790 H1235" class="greenLine"/>
  <rect x="1830" y="700" width="420" height="110" rx="8" class="decision"/>
  <text x="1855" y="735" class="nodeTitle">结束研究阶段</text>
  <text x="1855" y="761" class="body">ResearchComplete / 无 tool_calls</text>
  <text x="1855" y="787" class="small">或 research_iterations 超过上限，或委派执行异常</text>
  <path d="M1135 755 H1830" class="line"/>
  <path d="M2040 810 V1135" class="line"/>
  <text x="2064" y="870" class="label">notes = supervisor 中的 ToolMessage 内容</text>

  <!-- Researcher -->
  <rect x="90" y="930" width="1600" height="130" rx="8" class="group"/>
  <text x="115" y="960" class="section">researcher 子图（每个 ConductResearch 独立运行）</text>
  <rect x="115" y="978" width="275" height="58" rx="8" class="model"/>
  <text x="137" y="1013" class="nodeTitle">researcher</text><text x="256" y="1013" class="body">研究模型 + 所有工具</text>
  <rect x="470" y="978" width="315" height="58" rx="8" class="tool"/>
  <text x="492" y="1013" class="nodeTitle">researcher_tools</text><text x="650" y="1013" class="body">并发执行普通工具</text>
  <path d="M390 1007 H470" class="greenLine"/>
  <rect x="865" y="965" width="360" height="84" rx="8" class="tool"/>
  <text x="887" y="998" class="nodeTitle">工具集合</text>
  <text x="887" y="1024" class="body">think_tool / Search API / MCP / ResearchComplete</text>
  <path d="M785 1007 H865" class="greenLine"/>
  <rect x="1305" y="965" width="340" height="84" rx="8" class="result"/>
  <text x="1327" y="998" class="nodeTitle">compress_research</text>
  <text x="1327" y="1024" class="body">压缩 findings，保留 raw_notes</text>
  <path d="M1225 1007 H1305" class="line"/>
  <path d="M627 1036 V1050 H252 V1036" class="greenLine"/>
  <text x="445" y="1055" class="small">有后续搜索需要：工具输出回填 researcher_messages，再循环</text>
  <text x="875" y="1080" class="small">压缩条件：无 tool_calls 且无原生搜索 / ResearchComplete / 达到 max_react_tool_calls</text>

  <!-- Return and report -->
  <rect x="50" y="1115" width="2300" height="270" rx="10" class="group"/>
  <text x="76" y="1150" class="section">结果回传与最终报告</text>
  <rect x="90" y="1190" width="500" height="112" rx="8" class="result"/>
  <text x="115" y="1225" class="nodeTitle">ResearcherOutputState</text>
  <text x="115" y="1251" class="body">compressed_research → ConductResearch 的 ToolMessage</text>
  <text x="115" y="1277" class="body">raw_notes → SupervisorState.raw_notes（便于追踪原始材料）</text>
  <path d="M1645 1007 H1755 V1246 H590" class="line"/>
  <rect x="690" y="1190" width="445" height="112" rx="8" class="box"/>
  <text x="715" y="1225" class="nodeTitle">回到 supervisor</text>
  <text x="715" y="1251" class="body">研究摘要被作为工具结果供 supervisor 复盘</text>
  <text x="715" y="1277" class="body">可继续委派，或调用 ResearchComplete</text>
  <path d="M590 1246 H690" class="line"/>
  <rect x="1235" y="1190" width="495" height="112" rx="8" class="model"/>
  <text x="1260" y="1225" class="nodeTitle">final_report_generation</text>
  <text x="1260" y="1251" class="body">输入：research_brief + 对话 messages + notes（研究摘要）</text>
  <text x="1260" y="1277" class="body">使用 final_report_model；成功后清空 notes</text>
  <path d="M1135 1246 H1235" class="blueLine"/>
  <rect x="1820" y="1190" width="430" height="112" rx="8" class="result"/>
  <text x="1845" y="1225" class="nodeTitle">END：返回最终报告</text>
  <text x="1845" y="1251" class="body">final_report + AIMessage 写回 AgentState</text>
  <text x="1845" y="1277" class="body">最终节点允许流式输出</text>
  <path d="M1730 1246 H1820" class="blueLine"/>
  <text x="1250" y="1345" class="small">报告上下文超限：按模型上下文裁剪 findings，最多重试 3 次；非 token 异常立即返回错误信息。</text>

  <!-- Legend -->
  <rect x="50" y="1420" width="2300" height="220" rx="10" class="group"/>
  <text x="76" y="1455" class="section">读图要点</text>
  <rect x="90" y="1485" width="24" height="24" class="model"/><text x="126" y="1504" class="body">蓝色：模型调用 / 结构化输出</text>
  <rect x="430" y="1485" width="24" height="24" class="tool"/><text x="466" y="1504" class="body">绿色：工具调用 / 外部检索</text>
  <rect x="770" y="1485" width="24" height="24" class="result"/><text x="806" y="1504" class="body">紫色：状态或子图输出</text>
  <rect x="1110" y="1485" width="24" height="24" class="decision"/><text x="1146" y="1504" class="body">红色：分支与结束条件</text>
  <text x="90" y="1555" class="body">Tavily 路径会额外执行：并发检索 → URL 去重 → 网页摘要（structured Summary）→ 格式化来源；OpenAI / Anthropic 可走模型原生 Web Search。</text>
  <text x="90" y="1592" class="body">代码定位：deep_researcher.py（图与节点）、state.py（共享状态）、configuration.py（运行参数）、utils.py（搜索 / MCP / 重试）、security/auth.py（认证）。</text>
</svg>
